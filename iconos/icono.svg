<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Ícono de la PWA: monograma PEH sobre vidrio azul con brillo,
       en la misma línea visual que la app (Liquid Glass). -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f8cff"/>
      <stop offset="1" stop-color="#4b3fd9"/>
    </linearGradient>
    <linearGradient id="brillo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#fondo)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="url(#brillo)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none"
    stroke="#ffffff" stroke-opacity="0.4" stroke-width="4"/>
  <text
    x="256"
    y="296"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="156"
    font-weight="700"
    letter-spacing="-4"
    fill="#ffffff"
  >PEH</text>
  <text
    x="256"
    y="392"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="60"
    font-weight="500"
    fill="#ffffff"
    fill-opacity="0.82"
  >C1 ∧ C2 ∧ C3 ∧ C4</text>
</svg>
